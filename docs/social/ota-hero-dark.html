<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Zyvor OTA hero card</title>
<!--
  1200x630 dark hero card: README hero and GitHub social preview.
  Build: ./docs/social/build-hero-dark.sh  ->  ota-hero-dark.jpg (2400x1260)
-->
<style>
  :root { --blue:#0071e3; --signal:#2997ff; --cyan:#64d2ff; --green:#30d158; --amber:#ff9f0a; --red:#ff453a; --violet:#bf5af2;
    --sans:'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif; --mono:'SF Mono',Menlo,Consolas,monospace; }
  * { box-sizing:border-box; }
  html,body { margin:0; padding:0; }
  body { width:1200px; height:630px; overflow:hidden; color:#f5f5f7; font-family:var(--sans); position:relative; background:#000; }
  .aurora { position:absolute; inset:0;
    background:radial-gradient(720px 460px at 80% 16%, rgba(41,151,255,.34), transparent 62%),
               radial-gradient(600px 420px at 104% 98%, rgba(100,210,255,.16), transparent 60%),
               radial-gradient(520px 380px at 6% 110%, rgba(0,113,227,.28), transparent 60%); }
  .copy { position:absolute; left:60px; top:52px; width:560px; z-index:3; }
  .brand { display:flex; align-items:center; gap:12px; font-family:var(--mono); font-size:14px; letter-spacing:.18em; text-transform:uppercase; color:#a1a1a6; }
  .brand b { color:#fff; }
  .word { margin:20px 0 0; font-size:96px; line-height:.95; font-weight:800; letter-spacing:-.05em; white-space:nowrap;
    background:linear-gradient(92deg,#fff 0%,#e3f0ff 38%,var(--signal) 74%,var(--cyan) 100%); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:6px; }
  .tag { margin:14px 0 0; font-size:31px; line-height:1.15; font-weight:700; letter-spacing:-.02em; }
  .tag em { font-style:normal; color:var(--signal); }
  .lede { margin:12px 0 0; font-size:18px; line-height:1.45; color:#b8b8bf; width:520px; text-shadow:0 1px 12px #000; }
  .stats { margin-top:24px; display:flex; gap:32px; }
  .stat b { display:block; font-size:34px; font-weight:800; letter-spacing:-.03em; color:#fff; }
  .stat span { font-family:var(--mono); font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#8e8e93; }
  .pill { position:absolute; left:60px; bottom:40px; display:flex; gap:10px; z-index:3; }
  .pill span { font-family:var(--mono); font-size:13.5px; font-weight:700; padding:7px 13px; border-radius:18px; border:1.5px solid rgba(255,255,255,.2); color:#e5e5ea; background:rgba(0,0,0,.6); }
  .pill span.b { background:var(--blue); border-color:var(--blue); color:#fff; box-shadow:0 0 24px rgba(0,113,227,.55); }
  .art { position:absolute; left:520px; top:0; width:680px; height:630px; z-index:2; }
  .art svg { display:block; }
  #labels { position:absolute; inset:0; z-index:4; pointer-events:none; }
  .lbl { position:absolute; font-family:var(--mono); font-size:12.5px; color:#a1a1a6; text-align:center; transform:translate(-50%,-50%); white-space:nowrap; }
  .lbl b { display:block; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:#e5e5ea; }
  .lbl span { display:block; margin-top:3px; }
  .lbl.box { padding:7px 12px; border-radius:12px; background:rgba(8,10,14,.85); border:1px solid rgba(255,255,255,.14); }
  .lbl.chip { padding:6px 11px; border-radius:13px; font-size:12.5px; font-weight:700; color:#cfe6ff; background:rgba(10,20,35,.85); border:1px solid rgba(41,151,255,.5); box-shadow:0 0 16px rgba(41,151,255,.2); }
  .lbl.left { transform:translate(0,-50%); text-align:left; }
  .lbl.right { transform:translate(-100%,-50%); text-align:right; }
  .ok { color:var(--green) !important; } .warn { color:var(--amber) !important; } .bad { color:var(--red) !important; } .sig { color:var(--signal) !important; } .cy { color:var(--cyan) !important; } .vi { color:var(--violet) !important; }
</style>
</head>
<body>
<div class="aurora"></div>
<div class="art"><svg id="art" width="680" height="630" viewBox="0 0 680 630" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="labels"></div>
<div class="copy">
  <div class="brand"><svg viewBox="0 0 64 64" width="30" height="30" aria-hidden="true"><defs><linearGradient id="zb" x1="8" y1="8" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff5a15"/><stop offset="1" stop-color="#cc420a"/></linearGradient></defs><rect width="64" height="64" rx="15" fill="url(#zb)"/><path d="M18.5,20.5 45.5,20.5 18.5,43.5 45.5,43.5" fill="none" stroke="#fff" stroke-width="8.3" stroke-linecap="round" stroke-linejoin="round"/></svg><b>Zyvor</b><span>&middot;</span><span>Signed device OS updates</span></div>
  <div class="word">Zyvor OTA</div>
  <div class="tag">Signed A/B updates.<br><em>Commit or roll back.</em></div>
  <div class="lede">Open OTA runtime for Linux edge devices: Ed25519-signed releases, RAUC A/B slots, health-gated commit and automatic rollback.</div>
  <div class="stats"><div class="stat"><b>2</b><span>A/B slots</span></div><div class="stat"><b>3</b><span>health probes</span></div><div class="stat"><b>0</b><span>inbound ports</span></div></div>
</div>
<div class="pill"><span class="b">github.com/zyvorai/ota</span><span>Apache-2.0</span></div>
<script>
var Z = (function () {
  var NS = 'http://www.w3.org/2000/svg', svg = document.getElementById('art'), labels = document.getElementById('labels');
  var seed = 20261004;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function el(tag, a, parent) { var n = document.createElementNS(NS, tag); for (var k in a) n.setAttribute(k, a[k]); (parent || svg).appendChild(n); return n; }
  function g(attrs) { return el('g', attrs || {}); }
  function label(x, y, inner, cls, style) { var d = document.createElement('div'); d.className = 'lbl ' + (cls || ''); d.style.left = (520 + x) + 'px'; d.style.top = y + 'px'; if (style) d.setAttribute('style', d.getAttribute('style') + ';' + style); d.innerHTML = inner; labels.appendChild(d); return d; }
  return { NS: NS, svg: svg, W: 680, H: 630, rnd: rnd, el: el, g: g, label: label,
    reseed: function (s) { seed = s; },
    c: { blue: '#0071e3', signal: '#2997ff', cyan: '#64d2ff', green: '#30d158', amber: '#ff9f0a', red: '#ff453a', violet: '#bf5af2', teal: '#40c8e0', indigo: '#5e5ce6', pink: '#ff375f', white: '#f5f5f7', grey: '#8e8e93' } };
})();
(function () {
// Zyvor OTA: A/B slots. An Ed25519-sealed release streams into inactive slot B, a heartbeat runs the
// health gate, and an amber rollback arc returns to slot A.
var C = Z.c, AX = 266, BX = 478, TY = 232, BY = 436, RX = 68, RY = 19;
var d = Z.el('defs', {});
d.innerHTML = '<filter id="otgl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
  '<filter id="otsf" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="16"/></filter>' +
  '<linearGradient id="otglass" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9fd4ff" stop-opacity=".16"/><stop offset=".35" stop-color="#9fd4ff" stop-opacity=".04"/><stop offset=".8" stop-color="#9fd4ff" stop-opacity=".02"/><stop offset="1" stop-color="#9fd4ff" stop-opacity=".14"/></linearGradient>' +
  '<linearGradient id="otfillB" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#0071e3" stop-opacity=".75"/><stop offset="1" stop-color="#64d2ff" stop-opacity=".55"/></linearGradient>' +
  '<linearGradient id="otfillA" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1d3a66" stop-opacity=".8"/><stop offset="1" stop-color="#2a5fa8" stop-opacity=".45"/></linearGradient>' +
  '<marker id="otarrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff9f0a"/></marker>';

// faint texture
for (var k = 0; k < 40; k++) Z.el('circle', { cx: 80 + Z.rnd() * 120, cy: 40 + Z.rnd() * 380, r: .8 + Z.rnd() * 1.2, fill: C.cyan, opacity: (.08 + Z.rnd() * .25).toFixed(2) });
Z.el('ellipse', { cx: (AX + BX) / 2, cy: BY + 10, rx: 250, ry: 40, fill: C.signal, opacity: .12, filter: 'url(#otsf)' });

function cyl(cx, level, fillId, accent, glow) {
  var h = BY - TY, ly = BY - h * level;
  if (glow) Z.el('rect', { x: cx - RX, y: TY, width: 2 * RX, height: h, rx: 30, fill: accent, opacity: .18, filter: 'url(#otsf)' });
  // fill
  Z.el('path', { d: 'M' + (cx - RX) + ',' + ly + ' V' + BY + ' A' + RX + ',' + RY + ' 0 0 0 ' + (cx + RX) + ',' + BY + ' V' + ly + ' A' + RX + ',' + RY + ' 0 0 0 ' + (cx - RX) + ',' + ly + 'Z', fill: 'url(#' + fillId + ')' });
  Z.el('ellipse', { cx: cx, cy: ly, rx: RX, ry: RY, fill: accent, opacity: .35, stroke: accent, 'stroke-width': 1.2 });
  // layer lines
  for (var y = BY - 26; y > ly + 10; y -= 26) Z.el('path', { d: 'M' + (cx - RX) + ',' + y + ' A' + RX + ',' + RY + ' 0 0 0 ' + (cx + RX) + ',' + y, fill: 'none', stroke: 'rgba(200,230,255,.16)' });
  // glass
  Z.el('path', { d: 'M' + (cx - RX) + ',' + TY + ' V' + BY + ' A' + RX + ',' + RY + ' 0 0 0 ' + (cx + RX) + ',' + BY + ' V' + TY, fill: 'url(#otglass)', stroke: 'rgba(160,210,255,.55)', 'stroke-width': 1.4 });
  Z.el('ellipse', { cx: cx, cy: TY, rx: RX, ry: RY, fill: 'rgba(10,18,32,.6)', stroke: 'rgba(160,210,255,.7)', 'stroke-width': 1.4 });
  Z.el('line', { x1: cx - RX + 12, y1: TY + 24, x2: cx - RX + 12, y2: BY - 10, stroke: 'rgba(255,255,255,.22)', 'stroke-width': 3, 'stroke-linecap': 'round' });
}
cyl(AX, 0.92, 'otfillA', '#2a5fa8', false);
cyl(BX, 0.68, 'otfillB', C.cyan, true);

// signed release + seal (top right)
var SX = 586, SY = 116;
Z.el('circle', { cx: SX, cy: SY, r: 46, fill: C.indigo, opacity: .3, filter: 'url(#otsf)' });
Z.el('rect', { x: SX - 34, y: SY - 26, width: 56, height: 52, rx: 8, fill: 'rgba(14,22,38,.95)', stroke: 'rgba(160,210,255,.6)', 'stroke-width': 1.2 });
for (var l = 0; l < 4; l++) Z.el('rect', { x: SX - 26, y: SY - 16 + l * 9, width: l === 3 ? 22 : 38, height: 3.5, rx: 1.75, fill: 'rgba(200,220,255,.35)' });
var sp = '', n = 28, sr = 22, scx = SX + 22, scy = SY + 20;
for (var i = 0; i < n; i++) { var a = i / n * Math.PI * 2, r = i % 2 ? sr : sr - 3.5; sp += (i ? ' L' : 'M') + (scx + r * Math.cos(a)).toFixed(1) + ',' + (scy + r * Math.sin(a)).toFixed(1); }
Z.el('path', { d: sp + 'Z', fill: C.indigo, stroke: '#a9a8ff', 'stroke-width': 1, filter: 'url(#otgl)' });
Z.el('circle', { cx: scx, cy: scy, r: 13, fill: 'none', stroke: 'rgba(255,255,255,.6)', 'stroke-width': 1 });
Z.el('path', { d: 'M' + (scx - 6) + ',' + scy + ' l4,4 l8,-9', fill: 'none', stroke: '#fff', 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

// release stream into slot B, pouring onto its fill surface
var LY = BY - (BY - TY) * 0.68;
var streamD = 'M' + (SX - 30) + ',' + (SY + 26) + ' C' + (SX - 64) + ',' + (SY + 96) + ' ' + (BX + 30) + ',' + (TY - 80) + ' ' + BX + ',' + (LY - 4);
Z.el('path', { d: streamD, fill: 'none', stroke: C.cyan, 'stroke-width': 12, opacity: .2, filter: 'url(#otsf)' });
Z.el('path', { d: streamD, fill: 'none', stroke: C.cyan, 'stroke-width': 1.6, opacity: .7 });
var st = Z.el('path', { d: streamD, fill: 'none', stroke: '#fff', 'stroke-width': 2.4, 'stroke-dasharray': '1 9', 'stroke-linecap': 'round', filter: 'url(#otgl)' });
var SL = st.getTotalLength();
for (var k = 0; k < 6; k++) { var q = st.getPointAtLength(SL * (0.08 + k * 0.12)); Z.el('rect', { x: q.x - 3.5, y: q.y - 3.5, width: 7, height: 7, rx: 1.5, fill: '#fff', opacity: (.55 + k * .08).toFixed(2), filter: 'url(#otgl)' }); }
[14, 28, 44].forEach(function (r, n) { Z.el('ellipse', { cx: BX, cy: LY, rx: r, ry: r * RY / RX, fill: 'none', stroke: '#fff', 'stroke-width': 1.2, opacity: (.8 - n * .25).toFixed(2) }); });
Z.el('circle', { cx: BX, cy: LY - 2, r: 4, fill: '#fff', filter: 'url(#otgl)' });

// rollback arc B -> A
var rb = 'M' + (BX - 30) + ',' + (TY - 24) + ' C' + (BX - 60) + ',' + (TY - 120) + ' ' + (AX + 60) + ',' + (TY - 120) + ' ' + (AX + 26) + ',' + (TY - 28);
Z.el('path', { d: rb, fill: 'none', stroke: C.amber, 'stroke-width': 8, opacity: .14, filter: 'url(#otsf)' });
Z.el('path', { d: rb, fill: 'none', stroke: C.amber, 'stroke-width': 2, 'stroke-dasharray': '6 5', 'marker-end': 'url(#otarrow)', filter: 'url(#otgl)' });

// health-gate heartbeat under slot B
var HY = 512, hx0 = BX - 70, hx1 = 600;
Z.el('line', { x1: BX, y1: BY + RY + 4, x2: BX, y2: HY - 10, stroke: 'rgba(48,209,88,.5)', 'stroke-width': 1.2, 'stroke-dasharray': '2 3' });
var ecg = 'M' + hx0 + ',' + HY;
[hx0 + 40, hx0 + 110].forEach(function (b) { ecg += ' H' + b + ' l5,-5 l5,5 l4,0 l4,10 l6,-36 l6,40 l4,-14 l5,0 l6,-5 l6,5'; });
ecg += ' H' + hx1;
Z.el('path', { d: ecg, fill: 'none', stroke: C.green, 'stroke-width': 6, opacity: .18, filter: 'url(#otsf)' });
Z.el('path', { d: ecg, fill: 'none', stroke: C.green, 'stroke-width': 2, 'stroke-linejoin': 'round', filter: 'url(#otgl)' });
Z.el('circle', { cx: hx1 + 18, cy: HY, r: 14, fill: 'rgba(6,18,10,.9)', stroke: C.green, 'stroke-width': 2, filter: 'url(#otgl)' });
Z.el('path', { d: 'M' + (hx1 + 12) + ',' + HY + ' l4,4 l8,-8', fill: 'none', stroke: C.green, 'stroke-width': 2.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' });

// labels
Z.label(AX, (TY + BY) / 2 + 10, '<b>slot A</b><span>previous boot</span>');
Z.label(BX, (TY + BY) / 2 + 10, '<b>slot B</b><span>installing</span>');
Z.label(SX - 4, SY - 58, '<b class="vi">Ed25519</b><span>signed release</span>', 'box');
Z.label((AX + BX) / 2 - 4, TY - 124, '<b class="warn">rolled_back</b><span>failed-health</span>', 'box');
Z.label(hx0 - 74, HY, '<b class="ok">committed</b><span>health gate</span>', 'box');
Z.label(250, 52, 'RAUC &middot; D-Bus', 'chip');
})();
</script>
</body>
</html>
