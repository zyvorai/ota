<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Install in the image's system.d directory after reviewing vendor policy. -->
  <policy user="zyvor-ota">
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="InstallBundle"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetSlotStatus"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="GetPrimary"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="de.pengutronix.rauc.Installer" send_member="Mark"/>
    <allow send_destination="de.pengutronix.rauc" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow receive_sender="de.pengutronix.rauc"/>
  </policy>
</busconfig>
